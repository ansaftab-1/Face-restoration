<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Enhancer</title>
  <link rel="icon" type="image/x-icon" href="/facefusion.ico" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 50px 20px;
    }

    .container {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #000000;
      margin-bottom: 2px;
    }

    .subtitle {
      font-size: 15px;
      color: #4b5563;
      margin-bottom: 6px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 10px 14px;
      font-size: 15px;
      border: 1px solid #9ca3af;
      border-radius: 4px;
      outline: none;
      background: #ffffff;
      color: #111827;
      transition: border-color 0.15s ease;
    }

    input[type="text"]:focus, input[type="password"]:focus, select:focus {
      border-color: #000000;
    }

    /* Drag and Drop Zone */
    .drop-zone {
      border: 2px dashed #9ca3af;
      border-radius: 6px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .drop-zone:hover, .drop-zone.dragover {
      background: #f3f4f6;
      border-color: #000000;
    }

    .drop-zone-text {
      font-size: 14px;
      color: #4b5563;
    }

    .drop-zone-text span {
      font-weight: 600;
      color: #111827;
      text-decoration: underline;
    }

    input[type="file"] {
      display: none;
    }

    .preview-thumb-container {
      display: none;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #f3f4f6;
      border-radius: 4px;
      font-size: 14px;
      color: #374151;
    }

    .preview-thumb-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
      font-weight: 500;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 2px;
    }

    .options-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #374151;
    }

    .options-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .options-row label {
      cursor: pointer;
      user-select: none;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 6px;
    }

    .option-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      background: #fafafa;
      cursor: pointer;
      font-size: 13px;
      color: #374151;
      user-select: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .option-pill:hover {
      background: #f3f4f6;
      border-color: #9ca3af;
    }

    .option-pill input[type="checkbox"] {
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 500;
      color: #000000;
      background-color: #e5e7eb;
      border: 1px solid #9ca3af;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 4px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .submit-btn:hover:not(:disabled) {
      background-color: #d1d5db;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-box {
      display: none;
      padding: 12px 14px;
      border-radius: 4px;
      font-size: 14px;
    }

    .status-loading {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #f9fafb;
      border: 1px solid #d1d5db;
      color: #374151;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #e5e7eb;
      border-top: 2px solid #111827;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .status-error {
      background-color: #fef2f2;
      border: 1px solid #f87171;
      color: #991b1b;
    }

    /* Interactive Comparison Slider */
    .results-container {
      display: none;
      margin-top: 18px;
      width: 100%;
      flex-direction: column;
      gap: 14px;
    }

    .comparison-wrapper {
      position: relative;
      width: 100%;
      height: 380px;
      overflow: hidden;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      user-select: none;
    }

    .comparison-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #111827;
    }

    .img-before-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      overflow: hidden;
      z-index: 2;
    }

    .img-before-wrapper img {
      width: 100%;
      min-width: 100%;
    }

    .slider-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 3px;
      background: #ffffff;
      z-index: 3;
      cursor: ew-resize;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }

    .slider-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
      background: #ffffff;
      border: 2px solid #111827;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #111827;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .slider-badge-before {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.65);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
      z-index: 4;
      text-transform: uppercase;
    }

    .slider-badge-after {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.65);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
      z-index: 4;
      text-transform: uppercase;
    }

    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .download-btn {
      flex: 1;
      text-align: center;
      text-decoration: none;
      padding: 11px 14px;
      background-color: #111827;
      color: #ffffff;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.15s ease;
    }

    .download-btn:hover {
      background-color: #000000;
    }

    .reset-btn {
      padding: 11px 16px;
      background-color: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }

    .reset-btn:hover {
      background-color: #e5e7eb;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Photo Enhancer</h1>
    <div class="subtitle">Upload an old or blurry photo to restore faces and enhance clarity.</div>

    <form id="enhanceForm" onsubmit="handleEnhance(event)">
      <div class="form-group">
        <input 
          type="text" 
          id="apiKey" 
          placeholder="API key (optional if not set on server)" 
          autocomplete="off"
        />
      </div>

      <div class="form-group" style="margin-top: 6px;">
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('photoFile').click()">
          <div class="drop-zone-text">
            <span>Choose a photo</span> or drag &amp; drop here (.jpg, .png, .webp)
          </div>
        </div>
        <input 
          type="file" 
          id="photoFile" 
          accept="image/jpeg,image/png,image/webp,image/bmp" 
          onchange="handleFileSelect(event)"
        />

        <div id="previewThumb" class="preview-thumb-container">
          <div id="previewFileName" class="preview-thumb-name"></div>
          <span style="cursor: pointer; color: #ef4444; font-weight: 600;" onclick="removeFile(event)">&times;</span>
        </div>
      </div>

      <div class="options-grid" style="margin-top: 6px;">
        <label class="option-pill" for="colorizeOption">
          <input type="checkbox" id="colorizeOption" />
          <span>🎨 Colorize B&amp;W photo</span>
        </label>
        <label class="option-pill" for="vibranceOption">
          <input type="checkbox" id="vibranceOption" />
          <span>✨ Color Vibrance Pop</span>
        </label>
        <label class="option-pill" for="beautyOption">
          <input type="checkbox" id="beautyOption" />
          <span>🌸 Skin &amp; Beauty Retouch</span>
        </label>
        <label class="option-pill" for="upscaleOption">
          <input type="checkbox" id="upscaleOption" />
          <span>🔍 4x Ultra HD Upscale</span>
        </label>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Enhance photo</button>
    </form>

    <div id="statusBox" class="status-box"></div>

    <div id="resultsContainer" class="results-container">
      <div class="comparison-wrapper" id="comparisonWrapper">
        <span class="slider-badge-before">Original</span>
        <span class="slider-badge-after">Restored</span>

        <img id="imgAfter" src="" alt="Restored Photo" />
        <div class="img-before-wrapper" id="imgBeforeWrapper">
          <img id="imgBefore" src="" alt="Original Photo" />
        </div>
        <div class="slider-handle" id="sliderHandle">
          <div class="slider-circle">&#8596;</div>
        </div>
      </div>

      <div style="font-size: 13px; color: #6b7280; text-align: center;" id="timeInfo"></div>

      <div class="action-row">
        <a id="downloadBtn" class="download-btn" href="#" download>Download Enhanced Photo</a>
        <button type="button" class="reset-btn" onclick="resetForm()">Enhance another</button>
      </div>
    </div>
  </div>

  <script>
    let selectedFile = null;

    const dropZone = document.getElementById('dropZone');
    const photoFile = document.getElementById('photoFile');
    const previewThumb = document.getElementById('previewThumb');
    const previewFileName = document.getElementById('previewFileName');

    // Drag and drop handlers
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        setSelectedFile(e.dataTransfer.files[0]);
      }
    });

    function handleFileSelect(e) {
      if (e.target.files && e.target.files[0]) {
        setSelectedFile(e.target.files[0]);
      }
    }

    function setSelectedFile(file) {
      selectedFile = file;
      previewFileName.innerText = file.name;
      previewThumb.style.display = 'flex';
      dropZone.style.display = 'none';

      const previewUrl = URL.createObjectURL(selectedFile);
      document.getElementById('imgBefore').src = previewUrl;
    }

    function removeFile(e) {
      e.stopPropagation();
      selectedFile = null;
      photoFile.value = '';
      previewThumb.style.display = 'none';
      dropZone.style.display = 'flex';
    }

    // Comparison slider logic
    const wrapper = document.getElementById('comparisonWrapper');
    const beforeWrapper = document.getElementById('imgBeforeWrapper');
    const handle = document.getElementById('sliderHandle');
    let isSliding = false;

    function updateSlider(x) {
      const rect = wrapper.getBoundingClientRect();
      let pos = (x - rect.left) / rect.width;
      if (pos < 0.02) pos = 0.02;
      if (pos > 0.98) pos = 0.98;

      const pct = (pos * 100) + '%';
      beforeWrapper.style.width = pct;
      handle.style.left = pct;

      // Keep before image full container width inside clipped wrapper
      document.getElementById('imgBefore').style.width = rect.width + 'px';
    }

    wrapper.addEventListener('mousedown', () => isSliding = true);
    window.addEventListener('mouseup', () => isSliding = false);
    window.addEventListener('mousemove', (e) => {
      if (!isSliding) return;
      updateSlider(e.clientX);
    });

    wrapper.addEventListener('touchstart', () => isSliding = true);
    window.addEventListener('touchend', () => isSliding = false);
    window.addEventListener('touchmove', (e) => {
      if (!isSliding || !e.touches[0]) return;
      updateSlider(e.touches[0].clientX);
    });

    async function handleEnhance(e) {
      e.preventDefault();
      if (!selectedFile) {
        alert("Please choose a photo first.");
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const statusBox = document.getElementById('statusBox');
      const resultsContainer = document.getElementById('resultsContainer');
      const apiKey = document.getElementById('apiKey').value.trim();
      const colorize = document.getElementById('colorizeOption').checked;
      const vibrance = document.getElementById('vibranceOption').checked;
      const beauty = document.getElementById('beautyOption').checked;
      const upscale = document.getElementById('upscaleOption').checked;

      submitBtn.disabled = true;
      submitBtn.innerText = "Enhancing photo...";
      statusBox.style.display = "flex";
      statusBox.className = "status-box status-loading";
      statusBox.innerHTML = '<div class="spinner"></div><span>Restoring facial details &amp; clarity...</span>';
      resultsContainer.style.display = "none";

      const formData = new FormData();
      formData.append("file", selectedFile);
      if (apiKey) formData.append("api_key", apiKey);
      formData.append("face_enhancer_model", "gfpgan_1.4");
      formData.append("face_enhancer_blend", "80");
      formData.append("colorize", colorize ? "true" : "false");
      formData.append("vibrance_boost", vibrance ? "true" : "false");
      formData.append("beauty_retouch", beauty ? "true" : "false");
      formData.append("upscale", upscale ? "true" : "false");
      formData.append("response_format", "json");

      try {
        const headers = {};
        if (apiKey) headers["X-API-Key"] = apiKey;

        const response = await fetch("/api/v1/enhance/photo", {
          method: "POST",
          headers: headers,
          body: formData,
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail?.message || data.detail || (typeof data.detail === "object" ? JSON.stringify(data.detail) : "Enhancement failed."));
        }

        statusBox.style.display = "none";
        resultsContainer.style.display = "flex";

        document.getElementById('imgAfter').src = data.download_url + "?t=" + Date.now();
        document.getElementById('downloadBtn').href = data.download_url;
        document.getElementById('downloadBtn').download = "enhanced_" + selectedFile.name;
        document.getElementById('timeInfo').innerText = `Restored in ${data.processing_time_seconds}s`;

        // Reset slider to middle
        beforeWrapper.style.width = '50%';
        handle.style.left = '50%';
        setTimeout(() => {
          const rect = wrapper.getBoundingClientRect();
          document.getElementById('imgBefore').style.width = rect.width + 'px';
        }, 100);

      } catch (err) {
        statusBox.style.display = "block";
        statusBox.className = "status-box status-error";
        statusBox.innerText = "Error: " + err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Enhance photo";
      }
    }

    function resetForm() {
      document.getElementById('enhanceForm').reset();
      selectedFile = null;
      photoFile.value = '';
      previewThumb.style.display = 'none';
      dropZone.style.display = 'flex';
      document.getElementById('resultsContainer').style.display = "none";
      document.getElementById('statusBox').style.display = "none";
    }
  </script>
</body>
</html>
